name: Validate personal onboarding package
on:
  push:
    branches: ['distribution/personal-onboarding-1.4.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact ZIP and OAuth profile
        run: |
          python3 - <<'PY'
          import hashlib, sys, zipfile
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from validate_package import validate_archive
          directory = Path('personal-onboarding')
          path = directory/'wordrava-chatgpt-1.4.0-personal.zip'
          plugin,mcp=validate_archive(path,'1.4.0')
          with zipfile.ZipFile(path) as z:
              for name in z.namelist():
                  assert z.read(name)==(directory/name).read_bytes(),name
          print('Validated exact personal setup archive SHA256:',hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wordrava-personal-setup-validated
          path: personal-onboarding/wordrava-chatgpt-1.4.0-personal.zip
          if-no-files-found: error

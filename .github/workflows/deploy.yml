name: Publish and Deploy WordRava MCP
on:
  push:
    branches: [main]
    # Center sync-mcp.sh resolves the exact latest main SHA. Every main commit,
    # including documentation-only commits, must therefore publish that SHA image.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: mcp-production-pipeline
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/wordrava-for-chatgpt:main
            ghcr.io/${{ env.OWNER }}/wordrava-for-chatgpt:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package ChatGPT review bundle
        run: |
          python3 tests/check_marketplace.py
          python3 scripts/build_plugin.py
      - name: Publish validated MCP release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          tag="mcp-v$version"
          artifact="dist/wordrava-chatgpt-plugin-$version-review-draft.zip"
          python3 -c 'import json; print(json.load(open("marketplace/plugin.json"))["extensions"]["com.openai"]["review"]["release_notes"])' > dist/release-notes.md
          # Preserve the original immutable 1.1.1 release. Its plugin manifest
          # declared unsupported schema 1.0.2; publish the package-only repair
          # separately without changing the product/runtime version.
          if [ "$version" = "1.1.1" ]; then
            tag="$tag-schema-1.0.0"
            printf '\nPersonal import compatibility repair: both portable manifests use the supported Agent Plugins 1.0.0 schema. This archive supersedes the original mcp-v1.1.1 package; product version and OAuth settings remain unchanged.\n' >> dist/release-notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists; refusing to overwrite its immutable artifact"
          else
            gh release create "$tag" "$artifact" docs/MARKETPLACE_RELEASE.md docs/MARKETPLACE_RELEASE_FA.md --target "$GITHUB_SHA" --title "WordRava for ChatGPT MCP v$version" --notes-file dist/release-notes.md --latest
          fi

  deploy:
    needs: publish
    # WordRavaCenter's restricted 15-minute poller deploys immutable MCP
    # GHCR images without storing a broad VPS SSH key in this PUBLIC repo.
    # Optional direct SSH deployment stays disabled until an operator securely
    # configures its dedicated restricted SSH secrets and explicit variable.
    if: ${{ vars.WORDRAVA_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - name: Deploy approved image SHA to Ubuntu
        env:
          DEPLOY_HOST: ${{ secrets.WORDRAVA_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.WORDRAVA_SSH_USER }}
          DEPLOY_KEY: ${{ secrets.WORDRAVA_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.WORDRAVA_SSH_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ vars.WORDRAVA_SSH_PORT || '22' }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing WORDRAVA_SSH_HOST}"
          : "${DEPLOY_USER:?Missing WORDRAVA_SSH_USER}"
          : "${DEPLOY_KEY:?Missing WORDRAVA_SSH_PRIVATE_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing WORDRAVA_SSH_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/wordrava_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/wordrava_deploy ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -i ~/.ssh/wordrava_deploy -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            wordrava-deploy mcp "$GITHUB_SHA"


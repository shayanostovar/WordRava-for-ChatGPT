name: Publish WordRava MCP image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: wordrava-mcp-image-publish
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: ${{ github.repository == 'shayanostovar/WordRava-for-ChatGPT' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and protocol
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build
          npm test
          python3 tests/check_protocol.py
          python3 tests/check_marketplace.py
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable source SHA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/shayanostovar/wordrava-for-chatgpt:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/shayanostovar/WordRava-for-ChatGPT
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify published image can be read
        env:
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools inspect "ghcr.io/shayanostovar/wordrava-for-chatgpt:$SHA"


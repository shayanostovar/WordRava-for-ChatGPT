name: MCP CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Exercise MCP transport, schemas and scope boundaries
        run: npm test
      - name: Validate shared WordRava protocol
        run: python3 tests/check_protocol.py
      - name: Check marketplace metadata, tool annotations and OAuth
        run: python3 tests/check_marketplace.py
      - name: Package review-draft Plugin ZIP
        run: python3 scripts/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: wordrava-plugin-review-draft
          path: dist/wordrava-chatgpt-plugin-1.1.1-review-draft.zip
          if-no-files-found: error


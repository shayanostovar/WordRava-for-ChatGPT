name: MCP CI
on:
  push:
  pull_request:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Exercise MCP transport, schemas and scope boundaries
        run: npm test
      - name: Validate shared WordRava protocol
        run: python3 tests/check_protocol.py
      - name: Check marketplace metadata, tool annotations and OAuth
        run: python3 tests/check_marketplace.py
      - name: Reject unsupported Personal import schemas
        run: python3 tests/check_package_schema.py
      - name: Exercise universal development tools with the opt-in flag
        if: github.ref == 'refs/heads/development/1.4.0'
        env:
          WORDRAVA_UNIVERSAL_DISCOVERY_ENABLED: 'true'
        run: npm test
      - name: Assert incomplete universal development cannot be published
        if: github.ref == 'refs/heads/development/1.4.0'
        run: |
          set -euo pipefail
          if python3 tests/check_cloud_release.py; then echo 'Unexpectedly publishable development branch'; exit 1; fi
      - name: Validate limited cloud scope
        if: github.ref != 'refs/heads/development/1.4.0'
        run: python3 tests/check_cloud_release.py
      - name: Package internal review-draft Plugin ZIP
        if: github.ref != 'refs/heads/development/1.4.0'
        run: python3 scripts/build_plugin.py --review-draft
      - name: Check release readiness for main review package artifact
        if: github.ref == 'refs/heads/main'
        id: release_gate
        run: |
          if python3 tests/check_compatibility_gate.py --require-ready; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/development/1.4.0' && (github.ref != 'refs/heads/main' || steps.release_gate.outputs.ready == 'true')
        with:
          name: wordrava-plugin-review-draft
          path: dist/wordrava-chatgpt-plugin-1.3.1-review-draft.zip
          if-no-files-found: error

